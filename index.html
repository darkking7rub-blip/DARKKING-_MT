<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushoku Tensei - DARK KING</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ─────────────────────────────────────────────
   DESIGN SYSTEM — Crystal Glass / VisionOS 2026
   Filosofía: capas de profundidad real, no blur aleatorio.
   Cada capa tiene propósito: oscuridad, luz, material.
───────────────────────────────────────────── */

:root {
  /* Paleta amber refinada — más cálida, menos saturada que la original */
  --amber-100: #fff8e7;
  --amber-300: #fcd97a;
  --amber-400: #f5b942;
  --amber-500: #e8961e;
  --amber-600: #c97510;

  /* Superficie de cristal */
  --glass-white-4:  rgba(255, 255, 255, 0.04);
  --glass-white-8:  rgba(255, 255, 255, 0.08);
  --glass-white-12: rgba(255, 255, 255, 0.12);
  --glass-white-18: rgba(255, 255, 255, 0.18);
  --glass-border:   rgba(255, 255, 255, 0.16);
  --glass-border-bright: rgba(255, 255, 255, 0.30);

  /* Sombras estilo Apple — suaves, en capas */
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.15), 0 1px 3px rgba(0,0,0,0.10);
  --shadow-md:  0 8px 32px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.15);
  --shadow-lg:  0 20px 60px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.20);
  --shadow-xl:  0 32px 80px rgba(0,0,0,0.45), 0 16px 40px rgba(0,0,0,0.25);
  --shadow-amber: 0 8px 32px rgba(232, 150, 30, 0.20), 0 2px 8px rgba(232, 150, 30, 0.10);
  --shadow-amber-hover: 0 16px 48px rgba(232, 150, 30, 0.35), 0 4px 16px rgba(232, 150, 30, 0.20);

  /* Transiciones fluidas estilo Apple */
  --ease-apple: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);

  /* Tipografía — jerarquía clara */
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Inter', -apple-system, sans-serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  overflow-x: hidden;
  color: white;
  background: #080808;
  /* Antialiasing premium para texto */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ──────────────────────────────────────────
   VIDEO DE FONDO — integrado cinematográficamente
   El video NO compite: tiene un scrim multicapa
   que oscurece sin destruir la atmósfera.
────────────────────────────────────────── */
#bg-video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -3;
  /* Desaturación leve para que el video no domine la paleta */
  filter: saturate(0.7) brightness(0.85);
  transform: scale(1.03); /* evita bordes blancos al escalar */
}

/* Scrim cinematográfico en capas — NO un overlay plano */
/* Capa 1: oscuridad base con viñeta */
.video-overlay {
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse 120% 100% at 50% 50%,
      transparent 20%,
      rgba(8,8,8,0.45) 65%,
      rgba(8,8,8,0.80) 100%),
    linear-gradient(180deg,
      rgba(8,8,8,0.30) 0%,
      rgba(8,8,8,0.10) 40%,
      rgba(8,8,8,0.15) 70%,
      rgba(8,8,8,0.55) 100%);
}

/* Capa 2: tinte amber muy suave para armonizar paleta */
.video-tint {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(ellipse 80% 60% at 50% 80%,
    rgba(232, 150, 30, 0.06) 0%,
    transparent 70%);
  pointer-events: none;
}

/* ──────────────────────────────────────────
   PARTÍCULAS — sutiles, no distrayentes
   Reducidas en cantidad, velocidad y opacidad.
────────────────────────────────────────── */
.particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  /* Blanco suave en lugar de naranja saturado */
  background: rgba(255, 240, 200, 0.35);
  border-radius: 50%;
  animation: floatParticle 25s infinite ease-in-out;
  /* Sin box-shadow brillante que añada ruido */
}

/* Variaciones sutiles — menos es más */
.particle:nth-child(1)  { left: 8%;  animation-duration: 28s; animation-delay: 0s;   width: 3px; height: 3px; }
.particle:nth-child(2)  { left: 22%; animation-duration: 32s; animation-delay: 5s;   }
.particle:nth-child(3)  { left: 38%; animation-duration: 24s; animation-delay: 10s;  width: 3px; height: 3px; opacity: 0.5; }
.particle:nth-child(4)  { left: 54%; animation-duration: 30s; animation-delay: 3s;   }
.particle:nth-child(5)  { left: 72%; animation-duration: 26s; animation-delay: 8s;   }
.particle:nth-child(6)  { left: 88%; animation-duration: 35s; animation-delay: 1s;   width: 3px; height: 3px; opacity: 0.4; }

@keyframes floatParticle {
  0%   { transform: translateY(105vh) scale(0.5); opacity: 0; }
  8%   { opacity: 0.6; }
  88%  { opacity: 0.3; }
  100% { transform: translateY(-5vh) scale(1); opacity: 0; }
}

/* ──────────────────────────────────────────
   AMBIENT GLOW — elegante, no agresivo
   3 puntos de luz ambiental muy difusos.
   Reducida opacidad y tamaño vs. original.
────────────────────────────────────────── */
.glow {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  animation: floatGlow 18s ease-in-out infinite;
}

.glow:nth-child(1) {
  width: 500px; height: 500px;
  top: -200px; left: -200px;
  z-index: 0;
  background: radial-gradient(circle,
    rgba(232, 150, 30, 0.12) 0%,
    rgba(200, 110, 10, 0.06) 50%,
    transparent 70%);
}

.glow:nth-child(2) {
  width: 450px; height: 450px;
  bottom: -180px; right: -150px;
  z-index: 0;
  animation-delay: 7s;
  background: radial-gradient(circle,
    rgba(245, 185, 66, 0.10) 0%,
    rgba(200, 110, 10, 0.04) 50%,
    transparent 70%);
}

.glow:nth-child(3) {
  width: 350px; height: 350px;
  top: 45%; left: 55%;
  z-index: 0;
  animation-delay: 3s;
  animation-duration: 22s;
  background: radial-gradient(circle,
    rgba(255, 230, 150, 0.08) 0%,
    transparent 70%);
}

@keyframes floatGlow {
  0%, 100% { transform: translate(0px, 0px); }
  33%       { transform: translate(25px, -30px); }
  66%       { transform: translate(-15px, 15px); }
}

/* Todo el contenido principal sobre las capas de fondo */
.hero, .tabs, .section, footer { position: relative; z-index: 1; }

/* ──────────────────────────────────────────
   HERO — legibilidad garantizada
────────────────────────────────────────── */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 30px;
  /* Padding inferior para que la sección no quede pegada a tabs */
  padding-bottom: 80px;
}

.hero-content {
  max-width: 820px;
  animation: fadeUp 1.4s var(--ease-smooth) both;
}

/* Badge — cristal real, no solo glass */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  border-radius: 999px;
  /* Material cristalino con fondo más oscuro para legibilidad */
  background: rgba(232, 150, 30, 0.12);
  border: 1px solid rgba(232, 150, 30, 0.30);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  margin-bottom: 28px;
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 4px;
  color: var(--amber-300);
  text-transform: uppercase;
  /* Sombra que refuerza legibilidad */
  box-shadow:
    0 2px 16px rgba(232, 150, 30, 0.12),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.10);
}

/* Destello sutil en badge — no animación perpetua */
.badge::after {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--amber-400);
  box-shadow: 0 0 6px 2px rgba(232, 150, 30, 0.5);
  animation: badgePulse 3s ease-in-out infinite;
}

@keyframes badgePulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.5; transform: scale(0.7); }
}

/* H1 — tipografía display con garantía de legibilidad */
.hero h1 {
  font-family: var(--font-display);
  font-size: clamp(3.2rem, 10vw, 7rem);
  font-weight: 900;
  line-height: 1.0;
  letter-spacing: -0.02em;
  /* Gradient más suave: blanco → amber → oro */
  background: linear-gradient(160deg,
    #ffffff 0%,
    #fde8a0 30%,
    var(--amber-400) 60%,
    var(--amber-500) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 22px;
  /* text-shadow no funciona con background-clip:text,
     en cambio usamos filter para profundidad */
  filter: drop-shadow(0 4px 20px rgba(232, 150, 30, 0.20));
}

/* Párrafo con texto que siempre se lee bien */
.hero p {
  color: rgba(255, 255, 255, 0.78);
  font-size: 1.05rem;
  font-weight: 300;
  line-height: 1.85;
  max-width: 620px;
  margin: 0 auto;
  /* Garantía de legibilidad sobre video */
  text-shadow: 0 1px 4px rgba(0,0,0,0.40);
  animation: fadeUp 1.4s var(--ease-smooth) 0.15s both;
  letter-spacing: 0.01em;
}

/* CTA Button — acabado premium Apple */
.enter-btn {
  margin-top: 48px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 36px;
  border-radius: 999px;
  /* Cristal amber — no sólido naranja */
  background: linear-gradient(145deg,
    rgba(245, 185, 66, 0.22) 0%,
    rgba(232, 150, 30, 0.18) 100%);
  color: white;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  text-decoration: none;
  border: 1px solid rgba(245, 185, 66, 0.35);
  backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%);
  /* Brillo interno en la parte superior */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.15),
    0 8px 32px rgba(232, 150, 30, 0.20),
    0 2px 8px rgba(0,0,0,0.20);
  transition: all 0.4s var(--ease-apple);
  position: relative;
  overflow: hidden;
  text-shadow: 0 1px 3px rgba(0,0,0,0.30);
  animation: fadeUp 1.4s var(--ease-smooth) 0.30s both;
}

/* Reflejo interno animado — aparece solo al hover */
.enter-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg,
    transparent,
    rgba(255,255,255,0.18),
    transparent);
  transform: skewX(-20deg);
  transition: left 0.6s var(--ease-apple);
}

.enter-btn:hover {
  transform: translateY(-4px) scale(1.03);
  background: linear-gradient(145deg,
    rgba(245, 185, 66, 0.32) 0%,
    rgba(232, 150, 30, 0.28) 100%);
  border-color: rgba(245, 185, 66, 0.55);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.35),
    inset 0 -1px 0 rgba(0,0,0,0.10),
    0 16px 48px rgba(232, 150, 30, 0.30),
    0 4px 16px rgba(0,0,0,0.25);
}

.enter-btn:hover::before { left: 150%; }

.enter-btn:active { transform: translateY(-1px) scale(1.01); transition-duration: 0.1s; }

/* ──────────────────────────────────────────
   TABS — barra sticky cristalina
────────────────────────────────────────── */
.tabs {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  overflow-y: hidden;
  padding: 16px 20px;
  /* Material: vidrio oscuro con scrim superior */
  backdrop-filter: blur(40px) saturate(180%) brightness(0.85);
  -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(0.85);
  background: rgba(8, 8, 8, 0.55);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  /* Sombra que separa tabs del contenido debajo */
  box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.25);
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  border: none;
  padding: 11px 22px;
  border-radius: 12px;
  /* Tab inactivo: cristal muy sutil */
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.60);
  cursor: pointer;
  transition: all 0.3s var(--ease-apple);
  white-space: nowrap;
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 0.875rem;
  letter-spacing: 0.01em;
  border: 1px solid rgba(255,255,255,0.06);
  position: relative;
  overflow: hidden;
}

.tab:hover {
  color: rgba(255,255,255,0.85);
  background: rgba(255,255,255,0.09);
  transform: translateY(-1px);
}

/* Tab activo — estilo iOS pill */
.tab.active {
  color: white;
  font-weight: 600;
  /* Fondo amber cristalino */
  background: linear-gradient(145deg,
    rgba(245, 185, 66, 0.25),
    rgba(232, 150, 30, 0.20));
  border-color: rgba(245, 185, 66, 0.40);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.20),
    0 4px 16px rgba(232, 150, 30, 0.18),
    0 1px 4px rgba(0,0,0,0.20);
  text-shadow: 0 1px 3px rgba(0,0,0,0.20);
}

/* ──────────────────────────────────────────
   SECTIONS
────────────────────────────────────────── */
.section {
  display: none;
  padding: 80px 20px 100px;
  max-width: 860px;
  margin: 0 auto;
  animation: fadeUp 0.7s var(--ease-smooth) both;
}

.section.active { display: block; }

.section-title {
  text-align: center;
  margin-bottom: 52px;
}

.section-title h2 {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 5vw, 2.8rem);
  font-weight: 700;
  margin-bottom: 12px;
  /* Gradient refinado: blanco a amber */
  background: linear-gradient(160deg, #ffffff 0%, var(--amber-300) 50%, var(--amber-400) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 10px rgba(232, 150, 30, 0.12));
}

.section-title p {
  color: rgba(255,255,255,0.50);
  font-size: 0.95rem;
  font-weight: 300;
  letter-spacing: 0.02em;
}

/* ──────────────────────────────────────────
   CARD — Crystal Glass real
   Anatomía de cristal Apple VisionOS:
   1. Fondo: vidrio semitransparente
   2. Borde: línea luminosa arriba, oscura abajo
   3. Reflejo interno: gradiente blanco en la mitad superior
   4. Sombra: profunda y difusa en múltiples capas
────────────────────────────────────────── */
.card {
  position: relative;
  overflow: hidden;
  padding: 52px 44px 48px;
  border-radius: 28px;
  /* Material base */
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(40px) saturate(160%) brightness(1.05);
  -webkit-backdrop-filter: blur(40px) saturate(160%) brightness(1.05);
  /* Borde superior luminoso / inferior oscuro = efecto cristal */
  border-top: 1px solid rgba(255,255,255,0.22);
  border-left: 1px solid rgba(255,255,255,0.14);
  border-right: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  text-align: center;
  transition: transform 0.5s var(--ease-smooth),
              box-shadow 0.5s var(--ease-smooth),
              background 0.5s var(--ease-smooth);
  box-shadow:
    0 24px 64px rgba(0,0,0,0.35),
    0 8px 24px rgba(0,0,0,0.20),
    0 2px 8px rgba(0,0,0,0.15),
    inset 0 0 0 1px rgba(255,255,255,0.06); /* borde interno sutil */
}

/* Reflejo superior — simula superficie de cristal iluminada desde arriba */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(180deg,
    rgba(255,255,255,0.10) 0%,
    rgba(255,255,255,0.04) 40%,
    transparent 100%);
  border-radius: 28px 28px 0 0;
  pointer-events: none;
}

/* Brillo amber difuso en la base de la card */
.card::after {
  content: '';
  position: absolute;
  bottom: -20px; left: 50%;
  transform: translateX(-50%);
  width: 60%; height: 40px;
  background: radial-gradient(ellipse, rgba(232, 150, 30, 0.15) 0%, transparent 70%);
  filter: blur(10px);
  pointer-events: none;
  transition: opacity 0.5s var(--ease-apple);
  opacity: 0;
}

.card:hover {
  transform: translateY(-12px) scale(1.012);
  background: rgba(255,255,255,0.09);
  box-shadow:
    0 40px 80px rgba(0,0,0,0.40),
    0 16px 40px rgba(0,0,0,0.25),
    0 4px 16px rgba(0,0,0,0.15),
    0 0 0 1px rgba(255,255,255,0.12),
    inset 0 1px 0 rgba(255,255,255,0.15);
}

.card:hover::after { opacity: 1; }

/* Ícono — elegante, sin animación perpetua */
.card-icon {
  font-size: 56px;
  margin-bottom: 24px;
  display: inline-block;
  /* Transición solo al hover de la card */
  transition: transform 0.5s var(--ease-spring), filter 0.5s var(--ease-apple);
  filter: drop-shadow(0 4px 12px rgba(232, 150, 30, 0.20));
}

.card:hover .card-icon {
  transform: translateY(-8px) scale(1.08);
  filter: drop-shadow(0 8px 20px rgba(232, 150, 30, 0.35));
}

.card h3 {
  font-family: var(--font-display);
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 16px;
  background: linear-gradient(160deg, #ffffff 0%, var(--amber-100) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.card p {
  color: rgba(255,255,255,0.65);
  line-height: 1.75;
  font-size: 0.975rem;
  font-weight: 300;
  max-width: 480px;
  margin: 0 auto;
}

/* Botón Drive — cristal amber premium */
.drive-btn {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 36px;
  border-radius: 999px;
  background: linear-gradient(145deg,
    rgba(245, 185, 66, 0.20),
    rgba(232, 150, 30, 0.16));
  color: rgba(255,255,255,0.92);
  text-decoration: none;
  font-family: var(--font-body);
  font-size: 0.875rem;
  font-weight: 500;
  letter-spacing: 0.03em;
  border-top: 1px solid rgba(255,255,255,0.22);
  border-left: 1px solid rgba(255,255,255,0.14);
  border-right: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.18),
    0 4px 20px rgba(232, 150, 30, 0.15),
    0 2px 8px rgba(0,0,0,0.20);
  transition: all 0.4s var(--ease-apple);
  position: relative;
  overflow: hidden;
  text-shadow: 0 1px 3px rgba(0,0,0,0.25);
}

.drive-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -80%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.20), transparent);
  transform: skewX(-15deg);
  transition: left 0.55s var(--ease-apple);
}

.drive-btn:hover {
  transform: translateY(-3px) scale(1.04);
  background: linear-gradient(145deg,
    rgba(245, 185, 66, 0.30),
    rgba(232, 150, 30, 0.24));
  border-top-color: rgba(255,255,255,0.32);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.28),
    0 8px 30px rgba(232, 150, 30, 0.25),
    0 3px 12px rgba(0,0,0,0.25);
}

.drive-btn:hover::before { left: 140%; }

.drive-btn:active { transform: translateY(-1px) scale(1.01); transition-duration: 0.1s; }

/* ──────────────────────────────────────────
   SOCIAL GRID — tarjetas cristal elegantes
────────────────────────────────────────── */
.social-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.social {
  padding: 36px 24px 32px;
  border-radius: 24px;
  text-align: center;
  text-decoration: none;
  color: white;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(36px) saturate(150%);
  -webkit-backdrop-filter: blur(36px) saturate(150%);
  border-top: 1px solid rgba(255,255,255,0.18);
  border-left: 1px solid rgba(255,255,255,0.10);
  border-right: 1px solid rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: all 0.45s var(--ease-smooth);
  position: relative;
  overflow: hidden;
  box-shadow:
    0 12px 40px rgba(0,0,0,0.25),
    0 4px 12px rgba(0,0,0,0.15),
