<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mushoku Tensei — DARK KING</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    /* iOS 26 / VisionOS Palette */
    --bg: #050507;
    --fg: #f5f5f7;
    --fg-secondary: rgba(235,235,245,.65);
    --fg-tertiary: rgba(235,235,245,.35);
    
    /* Crystal Amber - cinematográfico, no quemado */
    --amber-1: #ffe4b5;
    --amber-2: #ffca7a;
    --amber-3: #ff9f0a;
    --amber-4: #ff7a00;
    
    /* Glass System */
    --glass-bg: rgba(22, 22, 26, 0.6);
    --glass-bg-strong: rgba(18, 18, 22, 0.75);
    --glass-border: rgba(255,255,255,.08);
    --glass-highlight: rgba(255,255,255,.12);
    --glass-shadow: rgba(0,0,0,.6);
    
    /* Blur & Saturation */
    --blur-xl: blur(40px) saturate(180%);
    --blur-lg: blur(28px) saturate(160%);
    --blur-md: blur(20px) saturate(150%);
    --blur-sm: blur(12px) saturate(140%);
    
    /* Radius */
    --r-xs: 12px;
    --r-sm: 16px;
    --r-md: 24px;
    --r-lg: 32px;
    --r-xl: 40px;
    
    /* Shadows - multicapa Apple */
    --shadow-1: 0 1px 2px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.12);
    --shadow-2: 0 8px 24px rgba(0,0,0,.2), 0 2px 8px rgba(0,0,0,.15);
    --shadow-3: 0 16px 48px rgba(0,0,0,.3), 0 8px 16px rgba(0,0,0,.2);
    --shadow-glow: 0 0 40px rgba(255,159,10,.15), 0 0 80px rgba(255,122,0,.08);
}

*{
    margin:0; padding:0; box-sizing:border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
}

html{ scroll-behavior:smooth; }

body{
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow-x: hidden;
    line-height: 1.6;
    letter-spacing: -0.01em;
}

/* ── VIDEO SYSTEM - CINEMATOGRÁFICO ── */
#bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -4;
    transform: scale(1.05);
    filter: brightness(.75) contrast(1.05) saturate(1.1);
}

/* Scrim inteligente multicapa */
.video-scrim {
    position: fixed;
    inset: 0;
    z-index: -3;
    pointer-events: none;
    background: 
        radial-gradient(1200px 800px at 50% -10%, rgba(0,0,0,.4) 0%, transparent 60%),
        radial-gradient(1000px 600px at 50% 110%, rgba(0,0,0,.55) 0%, transparent 55%),
        linear-gradient(180deg, rgba(5,5,7,.85) 0%, rgba(5,5,7,.4) 25%, rgba(5,5,7,.6) 75%, rgba(5,5,7,.95) 100%);
}

.video-vignette {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.5) 100%);
    mix-blend-mode: multiply;
}

.video-blur-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    mask: linear-gradient(180deg, black 0%, transparent 30%, transparent 70%, black 100%);
    pointer-events: none;
}

/* ── AMBIENT SYSTEM ── */
.ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .5;
    will-change: transform;
}

.orb-1 {
    width: 700px; height: 700px;
    top: -20%; left: -15%;
    background: radial-gradient(circle, rgba(255,159,10,.25), transparent 60%);
    animation: drift 28s ease-in-out infinite;
}

.orb-2 {
    width: 600px; height: 600px;
    bottom: -25%; right: -10%;
    background: radial-gradient(circle, rgba(255,122,0,.18), transparent 60%);
    animation: drift 32s ease-in-out infinite reverse;
}

.orb-3 {
    width: 500px; height: 500px;
    top: 30%; right: 20%;
    background: radial-gradient(circle, rgba(255,202,122,.15), transparent 60%);
    animation: drift 24s ease-in-out infinite;
}

@keyframes drift {
    0%,100% { transform: translate3d(0,0,0) scale(1); }
    33% { transform: translate3d(40px,-30px,0) scale(1.08); }
    66% { transform: translate3d(-30px,20px,0) scale(0.95); }
}

/* Partículas refinadas */
.particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 3px; height: 3px;
    background: radial-gradient(circle, rgba(255,202,122,.9), rgba(255,159,10,.4));
    border-radius: 50%;
    filter: blur(.5px);
    animation: rise linear infinite;
    opacity: 0;
}

.particle:nth-child(1){ left:8%; animation-duration:22s; animation-delay:0s; }
.particle:nth-child(2){ left:18%; animation-duration:26s; animation-delay:3s; width:2px; height:2px; }
.particle:nth-child(3){ left:28%; animation-duration:20s; animation-delay:6s; width:4px; height:4px; }
.particle:nth-child(4){ left:42%; animation-duration:28s; animation-delay:1s; }
.particle:nth-child(5){ left:56%; animation-duration:24s; animation-delay:4s; width:2.5px; height:2.5px; }
.particle:nth-child(6){ left:68%; animation-duration:30s; animation-delay:2s; }
.particle:nth-child(7){ left:78%; animation-duration:21s; animation-delay:7s; width:3.5px; height:3.5px; }
.particle:nth-child(8){ left:88%; animation-duration:27s; animation-delay:5s; width:2px; height:2px; }

@keyframes rise {
    0% { transform: translateY(110vh) translateX(0); opacity: 0; }
    5% { opacity: .8; }
    95% { opacity: .8; }
    100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
}

/* ── LAYOUT ── */
.hero, .tabs, .section, footer { position: relative; z-index: 10; }

/* ── HERO ── */
.hero {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 80px 24px 40px;
    text-align: center;
}

.hero-content {
    max-width: 920px;
    animation: enter .9s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes enter {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur-sm);
    -webkit-backdrop-filter: var(--blur-sm);
    box-shadow: inset 0 1px 0 var(--glass-highlight), var(--shadow-1);
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
}

.badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 40%);
    pointer-events: none;
}

.badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber-3);
    box-shadow: 0 0 10px var(--amber-3);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .6; transform: scale(.85); }
}

.badge span {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--fg-secondary);
}

.hero h1 {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    font-size: clamp(48px, 9vw, 104px);
    font-weight: 800;
    line-height: .9;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
    background: linear-gradient(180deg, #fff 0%, #ffe4c5 30%, #ffca7a 60%, #ff9f0a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.4));
}

.hero p {
    font-size: clamp(16px, 2.2vw, 19px);
    color: var(--fg-secondary);
    max-width: 680px;
    margin: 0 auto;
    font-weight: 400;
    line-height: 1.7;
}

.cta-wrap {
    margin-top: 44px;
    display: flex;
    justify-content: center;
}

.enter-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    border-radius: 999px;
    text-decoration: none;
    color: #0b0b0f;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -.01em;
    background: linear-gradient(180deg, var(--amber-1), var(--amber-3));
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,.7),
        inset 0 -1px 0 rgba(0,0,0,.15),
        0 8px 24px rgba(255,159,10,.25),
        0 2px 6px rgba(0,0,0,.2);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    isolation: isolate;
}

.enter-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,.2), transparent 40%);
    mix-blend-mode: overlay;
    pointer-events: none;
}

.enter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,.8),
        inset 0 -1px 0 rgba(0,0,0,.15),
        0 14px 36px rgba(255,159,10,.35),
        0 4px 10px rgba(0,0,0,.25);
}

.enter-btn:active { transform: translateY(0) scale(.98); }

/* ── TABS - VisionOS style ── */
.tabs-wrap {
    position: sticky;
    top: 16px;
    z-index: 100;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    margin-bottom: 20px;
    pointer-events: none;
}

.tabs {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    padding: 8px;
    border-radius: 20px;
    background: var(--glass-bg-strong);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur-lg);
    -webkit-backdrop-filter: var(--blur-lg);
    box-shadow: 
        inset 0 1px 0 var(--glass-highlight),
        0 10px 30px rgba(0,0,0,.4),
        0 2px 8px rgba(0,0,0,.3);
    overflow-x: auto;
    scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
    position: relative;
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    background: transparent;
    color: var(--fg-secondary);
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .2s, transform .2s;
    font-family: inherit;
}

.tab:hover { color: var(--fg); }

.tab.active {
    color: #0b0b0f;
}

.tab.active::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(180deg, #fff, #ffe1b3);
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,.9),
        inset 0 -1px 0 rgba(0,0,0,.1),
        0 4px 12px rgba(255,159,10,.25);
    z-index: -1;
    animation: tabIn .3s cubic-bezier(.2,.8,.2,1);
}

@keyframes tabIn {
    from { transform: scale(.96); opacity: .6; }
    to { transform: scale(1); opacity: 1; }
}

/* ── SECTIONS ── */
.section {
    display: none;
    padding: 40px 20px 80px;
    max-width: 980px;
    margin: 0 auto;
}

.section.active {
    display: block;
    animation: sectionIn .5s cubic-bezier(.2,.8,.2,1);
}

@keyframes sectionIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.section-title {
    text-align: center;
    margin-bottom: 40px;
}

.section-title h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 700;
    letter-spacing: -.02em;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #fff, #d8d8e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.section-title p {
    color: var(--fg-tertiary);
    font-size: 15px;
}

/* ── CARD - TRUE CRYSTAL GLASS ── */
.card {
    position: relative;
    padding: 48px 36px;
    border-radius: var(--r-xl);
    background: linear-gradient(180deg, rgba(28,28,34,.7), rgba(18,18,22,.6));
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur-xl);
    -webkit-backdrop-filter: var(--blur-xl);
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,.08),
        inset 0 -1px 0 rgba(0,0,0,.4),
        var(--shadow-3);
    overflow: hidden;
    text-align: center;
    isolation: isolate;
    transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
}

/* Borde físico realista */
.card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.03) 30%, rgba(0,0,0,.4) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
}

/* Reflejo superior - cristal real */
.card::after {
    content: '';
    position: absolute;
    top: 0; left: 1px; right: 1px;
    height: 55%;
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.02) 40%, transparent);
    pointer-events: none;
}

/* Glow interno sutil */
.card-glow {
    position: absolute;
    inset: -2px;
    border-radius: inherit;
    background: radial-gradient(600px 200px at 50% -10%, rgba(255,159,10,.15), transparent 60%);
    filter: blur(20px);
    z-index: -1;
    opacity: .7;
    transition: opacity .4s;
}

.card:hover {
    transform: translateY(-6px);
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(0,0,0,.4),
        0 24px 60px rgba(0,0,0,.45),
        var(--shadow-glow);
}

.card:hover .card-glow { opacity: 1; }

.card-icon {
    width: 84px; height: 84px;
    margin: 0 auto 22px;
    display: grid;
    place-items: center;
    border-radius: 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: var(--blur-sm);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px rgba(0,0,0,.3);
    font-size: 40px;
    position: relative;
}

.card-icon::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(60% 60% at 50% 0%, rgba(255,202,122,.25), transparent 70%);
    mix-blend-mode: screen;
}

.card h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.01em;
    margin-bottom: 10px;
    color: var(--fg);
}

.card p {
    color: var(--fg-secondary);
    font-size: 15px;
    line-height: 1.7;
    max-width: 520px;
    margin: 0 auto;
}

.drive-btn {
    margin-top: 28px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    color: var(--fg);
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: var(--blur-sm);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 4px 14px rgba(0,0,0,.25);
    transition: transform .2s, background .2s, box-shadow .2s;
}

.drive-btn:hover {
    transform: translateY(-2px);
    background: rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 8px 24px rgba(0,0,0,.3), 0 0 0 1px rgba(255,159,10,.2);
}

/* ── SOCIAL GRID ── */
.social-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
}

.social {
    position: relative;
    padding: 28px 24px;
    border-radius: var(--r-lg);
    text-decoration: none;
    color: var(--fg);
    background: linear-gradient(180deg, rgba(24,24,30,.65), rgba(16,16,20,.55));
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--blur-lg);
    -webkit-backdrop-filter: var(--blur-lg);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), var(--shadow-2);
    overflow: hidden;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
    isolation: isolate;
}

.social::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.02));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .6;
    transition: opacity .3s;
}

.social::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.07), transparent);
    pointer-events: none;
}

.social:hover {
    transform: translateY(-4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 16px 40px rgba(0,0,0,.35), 0 0 40px rgba(255,159,10,.12);
}

.social:hover::before { opacity: 1; }

.social .icon {
    font-size: 28px;
    width: 52px; height: 52px;
    display: grid; place-items: center;
    margin: 0 auto 12px;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
}

.social h3 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -.01em;
    text-align: center;
    color: var(--fg);
}

/* ── FOOTER ── */
footer {
    padding: 60px 20px 40px;
    text-align: center;
    color: var(--fg-tertiary);
    font-size: 13px;
    position: relative;
}

footer::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
}

/* ── REVEAL ── */
.reveal {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1);
}
.reveal.active { opacity: 1; transform: translateY(0); }

/* ── MOBILE ── */
@media (max-width: 768px) {
    .hero { padding-top: 60px; }
    .card { padding: 36px 24px; border-radius: 28px; }
    .tabs { padding: 6px; gap: 4px; }
    .tab { padding: 9px 14px; font-size: 13px; }
    .social-grid { grid-template-columns: 1fr; }
    .orb { filter: blur(80px); opacity: .4; }
    #bg-video { filter: brightness(.65) contrast(1.05) saturate(1.05); }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
}
</style>
</head>

</video>
<div class="video-scrim"></div>

<div class="ambient">

<div class="particles">

<!-- MANGA -->
<section class="section active" id="manga">
    <div
